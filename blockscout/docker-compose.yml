version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: blockscout-db
    restart: always
    environment:
      POSTGRES_DB: blockscout
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: blockscout_db_password
    command: >
      postgres
      -c max_connections=300
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c maintenance_work_mem=512MB
      -c work_mem=64MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c checkpoint_completion_target=0.9
      -c checkpoint_timeout=15min
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/blockscout/blockscout:latest
    container_name: blockscout-backend
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c 'bin/blockscout eval "Elixir.Explorer.ReleaseTasks.create_and_migrate()" && bin/blockscout start'

  frontend:
    image: ghcr.io/blockscout/frontend:latest
    container_name: blockscout-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_APP_HOST=localhost
      - NEXT_PUBLIC_AD_BANNER_PROVIDER=none
      - NEXT_PUBLIC_NETWORK_NAME=${CHAIN_NAME:-Ethereum}
      - NEXT_PUBLIC_NETWORK_SHORT_NAME=${CHAIN_NAME:-Ethereum}
      - NEXT_PUBLIC_NETWORK_ID=${CHAIN_ID:-1}
      - NEXT_PUBLIC_NETWORK_RPC_URL=http://localhost:8545
      - NEXT_PUBLIC_API_HOST=localhost
      - NEXT_PUBLIC_API_PORT=4000
      - NEXT_PUBLIC_API_PROTOCOL=http
      - NEXT_PUBLIC_APP_PORT=3000
    depends_on:
      - backend

volumes:
  postgres_data:
